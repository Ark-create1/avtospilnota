<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тема — АвтоСпільнота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .main { height: auto; overflow: visible; }
  /* Шапка теми: більший заголовок і текст */
  #topicTitle { font-size: 22px !important; line-height: 1.3; word-break: break-word; }
  #topicText { font-size: 15px !important; white-space: pre-line; word-break: break-word; }
  .reply-actions { padding-top: 8px; border-top: 1px solid var(--border); }
  .reply-item:hover .reply-bubble { border-color: var(--border-strong); }
  @media (max-width: 700px) {
    #topicTitle { font-size: 18px !important; }
    .reply-bubble { padding: 12px 12px; }
  }
  .topic-vote-row { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .topic-vote-hint { font-size: 12px; color: var(--text-hint); }

  /* ── Медіа в темі/відповіді ── */
  .post-media img { max-width: 100%; border-radius: 10px; margin-top: 10px; display: block; }
  .post-media .yt-embed {
    position: relative; padding-bottom: 56.25%; height: 0;
    border-radius: 10px; overflow: hidden; margin-top: 10px;
  }
  .post-media .yt-embed iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }

  /* ── Бульбашки-репліки (у стилі чату сайту) ── */
  .reply-item { display: flex; gap: 10px; align-items: flex-start; }

  .reply-bubble {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px 16px 16px 16px;
    padding: 14px 16px;
    flex: 1;
    min-width: 0;
  }

  .reply-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .reply-author { font-size: 12.5px; font-weight: 600; color: var(--text); text-decoration: none; }
  .reply-author:hover { text-decoration: underline; }
  .reply-time { font-size: 11px; color: var(--text-hint); }

  .reply-quote {
    border-left: 3px solid var(--border-strong);
    padding: 4px 10px;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--text-hint);
  }

  .reply-text { font-size: 14.5px; line-height: 1.65; color: var(--text); white-space: pre-line; word-break: break-word; }

  .reply-actions { display: flex; gap: 14px; margin-top: 8px; }
  .reply-action-btn {
    background: none; border: none; padding: 0;
    font-size: 11.5px; color: var(--text-hint); cursor: pointer;
    display: flex; align-items: center; gap: 4px; font-family: 'Manrope', sans-serif;
  }
  .reply-action-btn:hover { color: var(--red); }
  .reply-action-btn.liked { color: var(--red); font-weight: 600; }

  /* ── Форма відповіді ── */
  .media-field-label {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    display: flex; align-items: center; gap: 6px; margin-top: 4px;
  }
  .media-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .media-row input[type="text"] {
    flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); outline: none;
  }
  .file-btn {
    display: flex; align-items: center; gap: 5px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 12.5px; color: var(--text-muted);
    cursor: pointer; white-space: nowrap; font-family: 'Manrope', sans-serif;
  }
  .file-btn:hover { border-color: var(--red); color: var(--red); }
  .file-btn input[type="file"] { display: none; }

  .media-preview { margin-top: 6px; }
  .media-preview img { max-width: 100%; max-height: 140px; border-radius: 8px; display: block; }
  .media-preview .yt-embed { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 8px; overflow: hidden; }
  .media-preview .yt-embed iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }
  .media-preview .remove-media { font-size: 11px; color: var(--text-hint); cursor: pointer; margin-top: 4px; display: inline-block; }
  .media-preview .remove-media:hover { color: var(--red); }
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">
    <span class="logo-icon"><i class="ti ti-steering-wheel" style="color:#fff; font-size:17px;"></i></span>
    АвтоСпільнота
  </a>
  <nav class="header-nav">
    <a href="index.html">Питання</a>
    <a href="garage.html">Гараж</a>
    <a href="masters.html">Майстри</a>
    <a href="forum.html" class="active">Форум</a>
  </nav>
  <div class="header-actions">
    <div class="profile-menu">
      <button class="btn-ghost" id="authTriggerBtn"><i class="ti ti-user"></i> Увійти</button>
      <div class="profile-dropdown" id="profileDropdown"></div>
    </div>
    <button class="btn-ghost" id="logoutBtn" style="display:none;"><i class="ti ti-logout"></i> Вийти</button>
  </div>
</header>

<div class="layout layout-page" style="grid-template-columns: 1fr;">
  <main class="main" style="max-width: 860px; margin: 0 auto; width: 100%;">
    <a href="forum.html" style="font-size:13px; color:var(--text-muted); text-decoration:none; display:inline-flex; align-items:center; gap:4px; margin-bottom:4px;">
      <i class="ti ti-arrow-left"></i> Назад до форуму
    </a>

    <div class="q-card" style="cursor:default;">
      <div class="q-top">
        <div class="avatar av-blue" id="topicAvatar">??</div>
        <div class="q-body">
          <div class="q-title" id="topicTitle" style="white-space:normal; font-size:18px;">Завантаження...</div>
          <div class="q-meta" id="topicMeta"></div>
          <div class="q-tags" id="topicTags"></div>
        </div>
      </div>
      <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--border); font-size:14px; line-height:1.7;" id="topicText"></div>
      <div class="post-media" id="topicMedia"></div>
      <div class="topic-vote-row" id="topicVote"></div>
    </div>

    <div class="main-header">
      <span class="main-title">Відповіді (<span id="postsCount">0</span>)</span>
    </div>
    <div id="postsList" style="display:flex; flex-direction:column; gap:14px;"></div>

    <div class="ask-box" id="replyBox">
      <div class="ask-box-title">
        <i class="ti ti-message-2" style="font-size:15px;"></i>
        Написати відповідь
      </div>
      <div id="quotePreview"></div>
      <textarea id="postText" placeholder="Ваша відповідь..."></textarea>

      <div class="media-field-label"><i class="ti ti-photo"></i> Фото (опційно)</div>
      <div class="media-row">
        <input type="text" id="postPhotoUrl" placeholder="Посилання на фото (URL)...">
        <label class="file-btn">
          <i class="ti ti-upload"></i> Файл
          <input type="file" id="postPhotoFile" accept="image/*">
        </label>
      </div>
      <div class="media-preview" id="postPhotoPreview"></div>

      <div class="media-field-label"><i class="ti ti-brand-youtube"></i> YouTube (опційно)</div>
      <input type="text" id="postYoutubeUrl" placeholder="Посилання на YouTube-відео..." style="width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:'Manrope', sans-serif; background:var(--bg); color:var(--text); outline:none; margin-top:6px;">
      <div class="media-preview" id="postYoutubePreview"></div>

      <div class="ask-footer">
        <button class="btn-red" id="postSubmit" style="margin-left:auto;">
          <i class="ti ti-send"></i> Опублікувати
        </button>
      </div>
    </div>

    <div id="topicClosedMsg" style="display:none; color:var(--text-hint); padding:16px 0; text-align:center;">
      🔒 Тема закрита. Нові відповіді недоступні.
    </div>
  </main>
</div>

<div class="modal" id="authModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="authModalTitle">Увійти в акаунт</h3>
      <button class="modal-close" id="closeAuthModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Увійти</button>
        <button class="auth-tab" data-tab="register">Реєстрація</button>
      </div>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email адреса" required>
        <input type="password" id="loginPassword" placeholder="Пароль" required>
        <button type="button" class="btn-red" id="loginBtn">Увійти</button>
      </form>
      <form id="registerForm" style="display: none;">
        <input type="text" id="registerName" placeholder="Ім'я та Прізвище" required>
        <input type="email" id="registerEmail" placeholder="Email адреса" required>
        <input type="password" id="registerPassword" placeholder="Придумайте пароль" required>
        <button type="button" class="btn-red" id="registerBtn">Зареєструватися</button>
      </form>
      <div class="auth-footer">
        <span id="authHelpText">Немає акаунту?</span>
        <a href="#" id="switchLink">Зареєструватися</a>
      </div>
    </div>
  </div>
</div>

<script src="main.js"></script>
<script src="topic.js"></script>
</body>
</html>
