<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мій профіль — АвтоСпільнота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* ── Профіль: цій сторінці не потрібна фіксована висота/scroll-колонка з index.html ── */
  .main {
    height: auto;
    overflow: visible;
  }

  .profile-header {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }

  .profile-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--red-light);
    color: var(--red-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 600;
    font-size: 22px;
    flex-shrink: 0;
  }

  .profile-name {
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .profile-stats {
    display: flex;
    gap: 18px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .profile-stats b {
    color: var(--text);
    font-family: 'Unbounded', sans-serif;
    font-weight: 600;
  }

  .profile-tabs {
    display: flex;
    gap: 6px;
  }

  .profile-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-hint);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  .profile-empty i {
    font-size: 36px;
    display: block;
    margin-bottom: 12px;
    opacity: .5;
  }

  .answer-source {
    font-size: 12px;
    color: var(--text-hint);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }

  .answer-source a {
    color: var(--red);
    text-decoration: none;
    font-weight: 500;
  }

  .answer-source a:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- HEADER (той самий, що на інших сторінках) -->
<header class="header">
  <a href="index.html" class="logo">
    <span class="logo-icon"><i class="ti ti-steering-wheel" style="color:#fff; font-size:17px;"></i></span>
    АвтоСпільнота
  </a>
  <nav class="header-nav">
    <a href="index.html">Питання</a>
    <a href="garage.html">Гараж</a>
    <a href="masters.html">Майстри</a>
    <a href="forum.html">Форум</a>
  </nav>
  <div class="header-actions">
    <div class="profile-menu">
      <button class="btn-ghost" id="authTriggerBtn"><i class="ti ti-user"></i> Увійти</button>
      <div class="profile-dropdown" id="profileDropdown"></div>
    </div>
    <button class="btn-ghost" id="logoutBtn" style="display:none;"><i class="ti ti-logout"></i> Вийти</button>
   </div>
</header>

<div class="layout" style="grid-template-columns: 1fr;">
  <main class="main" style="max-width: 760px; margin: 0 auto; width: 100%; display:flex; flex-direction:column; gap:16px;">

    <a href="index.html" style="font-size:13px; color:var(--text-muted); text-decoration:none; display:inline-flex; align-items:center; gap:4px; margin-bottom:4px;">
      <i class="ti ti-arrow-left"></i> Назад до питань
    </a>

    <div id="profileContent"></div>

  </main>
</div>

<!-- Модалка авторизації (та сама, копія з index.html) -->
<div class="modal" id="authModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="authModalTitle">Увійти в акаунт</h3>
      <button class="modal-close" id="closeAuthModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Увійти</button>
        <button class="auth-tab" data-tab="register">Реєстрація</button>
      </div>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email адреса" required>
        <input type="password" id="loginPassword" placeholder="Пароль" required>
        <button type="button" class="btn-red" id="loginBtn">Увійти</button>
      </form>
      <form id="registerForm" style="display: none;">
        <input type="text" id="registerName" placeholder="Ім'я та Прізвище" required>
        <input type="email" id="registerEmail" placeholder="Email адреса" required>
        <input type="password" id="registerPassword" placeholder="Придумайте пароль" required>
        <button type="button" class="btn-red" id="registerBtn">Зареєструватися</button>
      </form>
      <div class="auth-footer">
        <span id="authHelpText">Немає акаунту?</span>
        <a href="#" id="switchLink">Зареєструватися</a>
      </div>
    </div>
  </div>
</div>

<script src="main.js"></script>
<script src="profile.js"></script>
</body>
</html>
