<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Майстри — АвтоСпільнота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<!-- MapLibre GL (рендерить векторні тайли OpenFreeMap) -->
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />

<style>
  /* Майстри: sidebar (пошук + фільтри + список) + карта на весь простір справа */
  .layout {
    max-width: 100%;
    margin: 0;
  }

  .main {
    padding: 0 !important;
    overflow: hidden;
    position: relative;
  }

  #mastersMap {
    width: 100%;
    height: 100%;
  }

  /* ── Рейка іконок (у дусі DeepState, вплиту до краю) ── */
  .masters-rail {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 52px;
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 14px;
    gap: 4px;
    z-index: 450;
  }

  .rail-mark {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-hint);
    font-size: 20px;
  }

  .rail-divider {
    width: 28px;
    height: 1px;
    background: var(--border);
    margin: 2px 0 10px;
  }

  .rail-btn {
    position: relative;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: none;
    color: var(--text-muted);
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.15s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .rail-btn:hover { color: var(--text); }
  .rail-btn.active { color: var(--red); }

  /* ── Кастомний тултіп замість повільного браузерного title ── */
  .rail-btn::before,
  .rail-btn::after {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s ease;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }

  .rail-btn::after {
    content: attr(data-tooltip);
    left: calc(100% + 10px);
    background: #1e293b;
    color: #fff;
    font-size: 12px;
    font-family: 'Manrope', sans-serif;
    padding: 6px 10px;
    border-radius: 6px;
    white-space: nowrap;
    z-index: 1000;
  }

  .rail-btn::before {
    content: '';
    left: 100%;
    border: 6px solid transparent;
    border-right-color: #1e293b;
    margin-left: -1px;
    z-index: 1000;
  }

  .rail-btn:hover::before,
  .rail-btn:hover::after {
    opacity: 1;
    transition-delay: 0.05s;
  }

  .btn-outline {
    background: var(--red-light);
    color: var(--red-dark);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    transition: all 0.15s;
  }

  .btn-outline:hover { background: var(--red); color: #fff; }

  .mp-added-by {
    font-size: 11px;
    color: var(--text-hint);
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--border);
  }

    #masterDescription {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  #masterDescription:focus { border-color: var(--red); }
  #masterDescription::placeholder { color: var(--text-hint); }

  /* ── Панель: пошук + кнопка завжди видні, фільтр/список — по кліку на рейку ── */
  .masters-flyout {
    position: absolute;
    top: 14px;
    left: 66px;
    width: 300px;
    max-height: calc(100% - 28px);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    z-index: 440;
  }

  .flyout-search-box {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .flyout-divider {
    height: 1px;
    background: var(--border);
    margin: 10px 0;
  }

  .flyout-body {
    max-height: 50vh;
    overflow-y: auto;
    padding: 14px 16px;
    display: none;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
  }

  .flyout-body.show { display: flex; }

  .flyout-section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-hint);
    margin-bottom: 8px;
  }

  .master-search-wrap {
    position: relative;
  }

  .master-search-wrap i {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-hint);
    font-size: 14px;
  }

  .master-search {
    width: 100%;
    padding: 9px 12px 9px 32px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .master-search:focus {
    border-color: var(--red);
    background: var(--bg-card);
  }

  .spec-filters { display: flex; flex-wrap: wrap; gap: 5px; }

  .spec-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 11px;
    font-family: 'Manrope', sans-serif;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .spec-chip.active {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }

  .master-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 4px;
  }

  .master-item:hover { background: var(--bg); }

  .master-item.selected {
    background: var(--red-light);
    border-color: var(--red);
  }

  .master-item-icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--blue-light);
    color: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .master-item.selected .master-item-icon {
    background: var(--red);
    color: #fff;
  }

  .master-item-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .master-item-addr { font-size: 11px; color: var(--text-hint); margin-top: 2px; }

  .master-popup { font-family: 'Manrope', sans-serif; min-width: 200px; }
  .master-popup .mp-name { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .master-popup .mp-addr { font-size: 12px; color: #666; margin-bottom: 4px; }
  .master-popup .mp-phone { font-size: 12px; margin-bottom: 6px; }
  .master-popup .mp-desc { font-size: 12px; line-height: 1.5; margin-top: 6px; }
  .master-popup .mp-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .master-popup .mp-tag {
    font-size: 10px; padding: 2px 7px; border-radius: 20px;
    background: var(--red-light); color: var(--red-dark);
  }

  @media (max-width: 640px) {
    .masters-flyout { width: calc(100vw - 52px); }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <a href="index.html" class="logo">
    <span class="logo-icon"><i class="ti ti-steering-wheel" style="color:#fff; font-size:17px;"></i></span>
    АвтоСпільнота
  </a>
  <nav class="header-nav">
    <a href="index.html">Питання</a>
    <a href="garage.html">Гараж</a>
    <a href="masters.html" class="active">Майстри</a>
    <a href="forum.html">Форум</a>
  </nav>
  <div class="header-actions">
    <div class="profile-menu">
      <button class="btn-ghost" id="authTriggerBtn"><i class="ti ti-user"></i> Увійти</button>
      <div class="profile-dropdown" id="profileDropdown"></div>
    </div>
    <button class="btn-ghost" id="logoutBtn" style="display:none;"><i class="ti ti-logout"></i> Вийти</button>
  </div>
</header>

<div class="layout" style="grid-template-columns: 1fr;">

  <!-- MAP + рейка іконок + flyout -->
  <main class="main">
    <div id="mastersMap"></div>

    <nav class="masters-rail">
      <div class="rail-mark"><i class="ti ti-map-2"></i></div>
      <div class="rail-divider"></div>
      <button class="rail-btn" data-panel="filter" data-tooltip="Фільтр"><i class="ti ti-filter"></i></button>
      <button class="rail-btn" data-panel="list" data-tooltip="Список СТО"><i class="ti ti-list"></i></button>
      <button class="rail-btn" id="locateBtn" data-tooltip="Моя позиція" aria-label="Моя позиція"><i class="ti ti-current-location"></i></button>
    </nav>

    <div class="masters-flyout" id="mastersFlyout">
      <div class="flyout-search-box">
        <div class="master-search-wrap">
          <i class="ti ti-search"></i>
          <input type="text" id="masterSearchInput" class="master-search" placeholder="Назва або адреса...">
        </div>
        <div class="flyout-divider"></div>
        <button class="btn-red" id="addMasterBtn" style="width:100%; justify-content:center;">
          <i class="ti ti-map-pin-plus"></i> Додати СТО
        </button>
        <button type="button" id="addMasterManualBtn" style="width:100%; background:none; border:none; color:var(--text-hint); font-size:11px; margin-top:6px; cursor:pointer; text-decoration:underline; font-family:'Manrope',sans-serif;">
          або вказати координати вручну
        </button>
      </div>

      <div class="flyout-body" id="flyoutBody">
        <div class="flyout-panel" id="panelFilter" style="display:none;">
          <div class="flyout-section-label">Спеціалізація</div>
          <div class="spec-filters" id="specFilters"></div>
        </div>

        <div class="flyout-panel" id="panelList" style="display:none;">
          <div class="flyout-section-label">Список (<span id="mastersCount">0</span>)</div>
          <div id="mastersList"></div>
        </div>
      </div>
    </div>
  </main>

</div>

<!-- MODAL: Додати СТО -->
<div class="modal" id="masterModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Додати СТО на карту</h3>
      <button class="modal-close" id="closeMasterModal">&times;</button>
    </div>
    <div class="modal-body">
      <div style="display:flex; gap:8px;">
        <input type="number" step="any" id="masterLat" placeholder="Широта">
        <input type="number" step="any" id="masterLng" placeholder="Довгота">
      </div>
      <button type="button" class="btn-outline" id="pickOnMapBtn">
        <i class="ti ti-map-pin"></i> Вказати кліком на карті
      </button>
      <input type="text" id="masterName" placeholder="Назва СТО">
      <input type="text" id="masterAddress" placeholder="Адреса (текстом, для показу)">
      <input type="text" id="masterPhone" placeholder="Телефон (опціонально)">
      <div class="spec-filters" id="masterSpecPicker"></div>
      <textarea id="masterDescription" placeholder="Короткий опис / чому рекомендуєте..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-red" id="saveMasterBtn"><i class="ti ti-send"></i> Додати</button>
    </div>
  </div>
</div>

<!-- Модалка авторизації -->
<div class="modal" id="authModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="authModalTitle">Увійти в акаунт</h3>
      <button class="modal-close" id="closeAuthModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Увійти</button>
        <button class="auth-tab" data-tab="register">Реєстрація</button>
      </div>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email адреса" required>
        <input type="password" id="loginPassword" placeholder="Пароль" required>
        <button type="button" class="btn-red" id="loginBtn">Увійти</button>
      </form>
      <form id="registerForm" style="display: none;">
        <input type="text" id="registerName" placeholder="Ім'я та Прізвище" required>
        <input type="email" id="registerEmail" placeholder="Email адреса" required>
        <input type="password" id="registerPassword" placeholder="Придумайте пароль" required>
        <button type="button" class="btn-red" id="registerBtn">Зареєструватися</button>
      </form>
      <div class="auth-footer">
        <span id="authHelpText">Немає акаунту?</span>
        <a href="#" id="switchLink">Зареєструватися</a>
      </div>
    </div>
  </div>
</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<!-- MapLibre GL -->
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<!-- Міст MapLibre GL -> Leaflet -->
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>

<script src="main.js"></script>
<script src="masters.js"></script>
</body>
</html>
