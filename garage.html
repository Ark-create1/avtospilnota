<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гараж — АвтоСпільнота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* Гараж — звичайна сторінка з прокруткою (у style.css .layout має фіксовану висоту й overflow:hidden,
     через що контент обрізався, а flex-блоки стискалися й накладалися один на одного) */
  .layout { height: auto; overflow: visible; max-width: 1200px; }
  .main { height: auto; overflow: visible; min-height: 0; gap: 16px; }
  .main > * { flex-shrink: 0; }

  /* ── Шапка сторінки ── */
  .garage-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .garage-title { font-family: 'Unbounded', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.2; margin: 0; }
  .garage-subtitle { font-size: 14px; color: var(--text-muted); margin: 6px 0 0; }
  .garage-stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
    padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--text-muted);
  }
  .stat-pill b { color: var(--text); font-weight: 700; }

  /* ── Вкладки типу ── */
  .type-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .type-tabs::-webkit-scrollbar { display: none; }
  .type-tab {
    flex-shrink: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; font-family: 'Manrope', sans-serif;
    color: var(--text-muted); cursor: pointer; transition: all 0.15s;
  }
  .type-tab:hover { border-color: var(--border-strong); color: var(--text); }
  .type-tab.active { background: var(--text); color: var(--bg-card); border-color: var(--text); }

  /* ── Тулбар: сортування + пошук ── */
  .garage-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .garage-search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
  .garage-search-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-hint); font-size: 14px; }
  .garage-search {
    width: 100%; padding: 9px 14px 9px 34px; border: 1px solid var(--border); border-radius: 20px;
    font-size: 13px; font-family: 'Manrope', sans-serif; background: var(--bg-card); color: var(--text); outline: none;
    transition: border-color 0.15s;
  }
  .garage-search:focus { border-color: var(--red); }

  .tag-filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-filters:empty { display: none; }
  .tag-chip {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 4px 11px;
    font-size: 11.5px; font-family: 'Manrope', sans-serif; color: var(--text-muted); cursor: pointer; transition: all 0.15s;
  }
  .tag-chip.active { background: var(--red); color: #fff; border-color: var(--red); }

  /* ── Сітка карток ── */
  .garage-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 18px; }
  .garage-list > .garage-empty { grid-column: 1 / -1; }
  #buildOfWeek:empty { display: none; }

  .work-post {
    display: flex; flex-direction: row; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; min-width: 0;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .work-post:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,0.09); border-color: var(--border-strong); }

  /* Збоку: вертикальна колонка голосування */
  .work-post-votecol { flex-shrink: 0; width: 46px; padding: 12px 0 0 8px; background: var(--bg-card); }
  .vote-pill-v { flex-direction: column; border-radius: 20px; padding: 2px; }
  .vote-pill-v .vote-btn { width: 30px; height: 30px; }
  .vote-pill-v .vote-score { padding: 2px 0; }
  .work-post-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* Фото / заглушка */
  .work-post-media { position: relative; aspect-ratio: 16 / 10; overflow: hidden; cursor: pointer; background: var(--bg); }
  .work-post-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
  .work-post:hover .work-post-img { transform: scale(1.03); }
  .work-post-media .type-badge {
    position: absolute; top: 10px; left: 10px; margin: 0; padding: 4px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .work-post-ph {
    width: 100%; height: 100%; position: relative; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: linear-gradient(135deg, hsl(var(--h) 45% 22%), hsl(calc(var(--h) + 40) 55% 42%));
  }
  .ph-icon { position: absolute; right: -14px; bottom: -18px; font-size: 110px; opacity: 0.13; }
  .ph-make { font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; text-align: center; padding: 0 12px; }
  .ph-model { font-size: 14px; opacity: 0.8; font-weight: 600; text-align: center; padding: 0 12px; }

  /* Тіло */
  .work-post-body { padding: 14px 16px 8px; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .work-post-carrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .work-post-car {
    font-size: 11px; font-weight: 600; background: var(--blue-light); color: var(--blue);
    padding: 2px 9px; border-radius: 20px; text-decoration: none;
  }
  .engine-chip {
    font-size: 11px; font-weight: 600; font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); padding: 1px 8px; border-radius: 6px;
  }
  .work-post-title {
    font-size: 16px; font-weight: 700; line-height: 1.35; color: var(--text); cursor: pointer; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .work-post-title:hover { color: var(--red); }
  .work-post-text {
    font-size: 13.5px; line-height: 1.55; color: var(--text-muted); word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .work-post-tags { display: flex; gap: 5px; flex-wrap: wrap; }

  /* Низ картки: автор + голосування */
  .work-post-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px 14px; margin-top: auto;
  }
  .work-post-author { display: flex; align-items: center; gap: 8px; min-width: 0; text-decoration: none; color: var(--text-muted); font-size: 12.5px; }
  .work-post-author:hover .author-name { color: var(--text); text-decoration: underline; }
  .mini-avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; background: var(--bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-muted);
  }
  .author-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .work-post-date { white-space: nowrap; color: var(--text-hint); font-size: 11.5px; }

  /* ── Білд тижня (велика картка) ── */
  .work-post.featured { position: relative; flex-direction: column; min-height: 340px; border: none; background: #111; color: #fff; }
  .work-post.featured:hover { transform: none; }
  .hero-media { position: absolute; inset: 0; cursor: pointer; }
  .hero-media .work-post-img, .hero-media .work-post-ph { width: 100%; height: 100%; }
  .hero-media .ph-make { font-size: 44px; }
  .hero-media .ph-model { font-size: 20px; }
  .hero-media .ph-icon { font-size: 220px; right: 20px; bottom: -40px; }
  .hero-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.15) 65%, rgba(0,0,0,0.25) 100%); pointer-events: none; }
  .work-post.featured .vote-pill { position: absolute; top: 14px; left: 14px; z-index: 2; background: rgba(255,255,255,0.94); }
  .hero-content { position: relative; margin-top: auto; padding: 28px; pointer-events: none; }
  .hero-content a, .hero-content .hero-title { pointer-events: auto; }
  .featured-label {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    background: #f5b942; color: #4a2c00; padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;
  }
  .hero-title { font-family: 'Unbounded', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.25; color: #fff; margin: 0 0 12px; -webkit-line-clamp: 3; }
  .hero-title:hover { color: #fff; text-decoration: underline; }
  .hero-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .hero-meta .type-badge { margin: 0; }
  .hero-car { font-weight: 600; }
  .hero-meta .engine-chip { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); color: #fff; }
  .hero-author { color: rgba(255,255,255,0.85); text-decoration: none; margin-left: auto; font-weight: 600; }
  .hero-author:hover { text-decoration: underline; }

  /* ── Порожній стан ── */
  .garage-empty { text-align: center; padding: 56px 16px; color: var(--text-muted); background: var(--bg-card); border: 1px dashed var(--border-strong); border-radius: 14px; }
  .garage-empty-icon { font-size: 44px; margin-bottom: 8px; }
  .garage-empty-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .garage-empty-text { font-size: 13.5px; margin-bottom: 18px; }
  .garage-empty .btn-red { display: inline-flex; justify-content: center; }

  @media (max-width: 700px) {
    .garage-title { font-size: 20px; }
    .garage-search-wrap { max-width: none; flex-basis: 100%; }
    .work-post.featured { min-height: 280px; }
    .hero-content { padding: 18px; }
    .hero-title { font-size: 18px; }
    .hero-media .ph-make { font-size: 30px; }
    .hero-author { margin-left: 0; }
  }

  /* ── Завантаження, помилка, «Показати ще» ── */
  .garage-skeleton {
    height: 400px; border-radius: 14px; border: 1px solid var(--border);
    background: linear-gradient(90deg, var(--bg-card) 25%, #eceae4 50%, var(--bg-card) 75%);
    background-size: 200% 100%; animation: garageShimmer 1.3s infinite linear;
  }
  @keyframes garageShimmer { to { background-position: -200% 0; } }
  .garage-error {
    grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--text-muted);
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  }
  .garage-more { grid-column: 1 / -1; display: flex; justify-content: center; padding: 6px 0 14px; }
  .btn-more {
    background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 20px;
    padding: 10px 26px; font-size: 13.5px; font-weight: 600; font-family: 'Manrope', sans-serif;
    color: var(--text); cursor: pointer; transition: all 0.15s;
  }
  .btn-more:hover:not(:disabled) { background: var(--text); color: #fff; border-color: var(--text); }
  .btn-more:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

<!-- HEADER (той самий, що на інших сторінках) -->
<header class="header">
  <a href="index.html" class="logo">
    <span class="logo-icon"><i class="ti ti-steering-wheel" style="color:#fff; font-size:17px;"></i></span>
    АвтоСпільнота
  </a>
  <nav class="header-nav">
    <a href="index.html">Питання</a>
    <a href="garage.html" class="active">Гараж</a>
    <a href="masters.html">Майстри</a>
    <a href="forum.html">Форум</a>
  </nav>
  <div class="header-actions">
    <div class="profile-menu">
      <button class="btn-ghost" id="authTriggerBtn"><i class="ti ti-user"></i> Увійти</button>
      <div class="profile-dropdown" id="profileDropdown"></div>
    </div>
    <button class="btn-ghost" id="logoutBtn" style="display:none;"><i class="ti ti-logout"></i> Вийти</button>
  </div>
</header>

<div class="layout" style="grid-template-columns: 1fr;">
  <main class="main" style="max-width: 1160px; margin: 0 auto; width: 100%;">

    <div class="garage-head">
      <div>
        <h1 class="garage-title">🚗 Гараж</h1>
        <p class="garage-subtitle">Ремонти, тюнінг і божевільні білди від спільноти. Голосуй за найкращі.</p>
      </div>
      <button class="btn-red" id="addCarBtn"><i class="ti ti-plus"></i> Додати авто</button>
    </div>

    <div class="garage-stats" id="garageStats"></div>

    <div id="buildOfWeek"></div>

    <div class="type-tabs" id="typeFilters">
      <button class="type-tab active" data-type="all">Усе</button>
      <button class="type-tab" data-type="repair">🔧 Ремонт</button>
      <button class="type-tab" data-type="tuning">⚡ Тюнінг</button>
      <button class="type-tab" data-type="project">🚀 Проєкти</button>
    </div>

    <div class="garage-toolbar">
      <div class="filters" id="sortFilters">
        <button class="filter-btn active" data-sort="new"><i class="ti ti-clock"></i> Нові</button>
        <button class="filter-btn" data-sort="week"><i class="ti ti-flame"></i> Топ тижня</button>
        <button class="filter-btn" data-sort="month"><i class="ti ti-calendar"></i> Топ місяця</button>
        <button class="filter-btn" data-sort="all"><i class="ti ti-trophy"></i> За весь час</button>
      </div>
      <div class="garage-search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" id="garageSearchInput" class="garage-search" placeholder="Автор, авто, двигун...">
      </div>
    </div>

    <div class="tag-filters" id="tagFilters"></div>

    <div id="garageList" class="garage-list"></div>
  </main>
</div>

<!-- MODAL: Додати авто -->
<div class="modal" id="carModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Додати авто в гараж</h3>
      <button class="modal-close" id="closeCarModal">&times;</button>
    </div>
    <div class="modal-body">
      <input type="text" id="carMake" placeholder="Марка (наприклад, Audi)">
      <input type="text" id="carModel" placeholder="Модель (наприклад, A6 C6)">
      <input type="text" id="carEngineCode" placeholder="Код двигуна (наприклад, BRE) — опціонально">
      <input type="number" id="carYear" placeholder="Рік випуску">
      <input type="number" id="carMileage" placeholder="Пробіг, км">
    </div>
    <div class="modal-footer">
      <button class="btn-red" id="saveCarBtn"><i class="ti ti-send"></i> Додати</button>
    </div>
  </div>
</div>

<!-- Модалка авторизації (та сама, копія з index.html) -->
<div class="modal" id="authModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="authModalTitle">Увійти в акаунт</h3>
      <button class="modal-close" id="closeAuthModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Увійти</button>
        <button class="auth-tab" data-tab="register">Реєстрація</button>
      </div>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email адреса" required>
        <input type="password" id="loginPassword" placeholder="Пароль" required>
        <button type="button" class="btn-red" id="loginBtn">Увійти</button>
      </form>
      <form id="registerForm" style="display: none;">
        <input type="text" id="registerName" placeholder="Ім'я та Прізвище" required>
        <input type="email" id="registerEmail" placeholder="Email адреса" required>
        <input type="password" id="registerPassword" placeholder="Придумайте пароль" required>
        <button type="button" class="btn-red" id="registerBtn">Зареєструватися</button>
      </form>
      <div class="auth-footer">
        <span id="authHelpText">Немає акаунту?</span>
        <a href="#" id="switchLink">Зареєструватися</a>
      </div>
    </div>
  </div>
</div>

<script src="main.js"></script>
<script src="garage.js"></script>
</body>
</html>
